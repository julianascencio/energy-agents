[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "energy-agents"
version = "0.1.0"
description = "Evidence-backed agent engineering for energy systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ASVA Consulting"}]
license = "MIT"
dependencies = []

[project.optional-dependencies]
quantum = ["numpy>=2,<3"]
quantum-hybrid = ["numpy>=2,<3", "pennylane>=0.45,<0.46", "torch>=2.6,<3", "qiskit>=2,<3"]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
docs = ["sphinx>=8,<9", "pydata-sphinx-theme>=0.16,<0.17", "sphinx-gallery>=0.19,<0.20", "matplotlib>=3.9,<4"]

[project.scripts]
energy-agents-equity = "energy_agents.business.equity:main"
energy-agents-bid = "energy_agents.business.bid:main"
energy-agents-debt = "energy_agents.business.debt:main"
energy-agents-campus = "energy_agents.campus:main"
energy-agents-tandem = "energy_agents.business.tandem:main"
energy-agents-qml = "energy_agents.quantum_ml.__main__:main"
energy-agents-cen = "energy_agents.operations.cen:main"
energy-agents-ops = "energy_agents.operations.__main__:main"
energy-agents-ops-mcp = "energy_agents.operations.mcp_server:main"
energy-agents-roles = "energy_agents.career_roles:main"
energy-agents-procurement = "energy_agents.business.procurement:main"
energy-agents-vppa = "energy_agents.business.vppa:main"
energy-agents-design = "energy_agents.data_center:main"
energy-agents-reserve = "energy_agents.business.reserve:main"
energy-agents-bridge = "energy_agents.business.bridge_power:main"
energy-agents = "energy_agents.analysis:main"
energy-agents-flex = "energy_agents.flexibility:main"
energy-agents-pv = "energy_agents.pv.analysis:main"
energy-agents-commissioning = "energy_agents.commissioning:main"

energy-agents-bess = "energy_agents.business.analysis:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
