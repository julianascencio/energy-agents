[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "energy-agents"
version = "0.1.0"
description = "Evidence-backed agent engineering for energy systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ASVA Consulting"}]
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
docs = ["sphinx>=8,<9", "pydata-sphinx-theme>=0.16,<0.17", "sphinx-gallery>=0.19,<0.20", "matplotlib>=3.9,<4"]

[project.scripts]
energy-agents = "energy_agents.analysis:main"
energy-agents-pv = "energy_agents.pv.analysis:main"
energy-agents-knowledge = "energy_agents.knowledge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
