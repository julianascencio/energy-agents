name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,quantum]"
      - run: ruff check .
      - run: python -m pytest
      - run: python -m build
      - run: energy-agents --output outputs/building_edits
      - run: energy-agents-pv --output outputs/pv_operations
      - run: energy-agents-flex --output outputs/industrial_flexibility

      - run: energy-agents-commissioning --output outputs/wind_commissioning

      - run: energy-agents-bess --output outputs/bess_saturation

      - run: energy-agents-bridge --output outputs/bridge_power

      - run: energy-agents-reserve --output outputs/reserve
      - run: energy-agents-campus --output outputs/campus_team

      - run: energy-agents-nonfirm --output outputs/nonfirm
      - run: energy-agents-guarantee --output outputs/guarantee
      - run: energy-agents-correlation --output outputs/correlation
      - run: energy-agents-firm --output outputs/firm_supply
      - run: energy-agents-sharing --output outputs/sharing
      - run: energy-agents-recovery --output outputs/recovery
      - run: energy-agents-augmentation --output outputs/augmentation
      - run: energy-agents-heat --output outputs/heat_reuse
      - run: energy-agents-equity --output outputs/preferred_equity
      - run: energy-agents-bid --output outputs/storage_bid
      - run: energy-agents-debt --output outputs/wind_debt
      - run: energy-agents-tandem --output outputs/tandem
      - run: energy-agents-vppa --output outputs/vppa
      - run: energy-agents-procurement --output outputs/procurement
      - run: energy-agents-roles --output outputs/career_roles
      - run: energy-agents-qml --output outputs/quantum_ml
  quantum-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,quantum-hybrid]"
      - run: python -m pytest tests/test_quantum_ml_backends.py
      - run: energy-agents-qml --hybrid --output outputs/quantum_ml_hybrid
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-ml-research
          path: outputs/quantum_ml_hybrid
  operations-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,mcp]"
      # This EDI module is stdlib-only; other scientific EDI dependencies are unrelated.
      - uses: ./.github/actions/install-operations-backend
      - run: python -m pytest tests/test_operations_service.py tests/test_operations_mcp.py tests/test_cen_operations.py tests/test_heat_reuse.py tests/test_firm_supply.py tests/test_correlation.py tests/test_augmentation.py tests/test_recovery.py
      - run: energy-agents-correlation --edi --output outputs/correlation_edi
      - run: energy-agents-recovery --edi --output outputs/recovery_edi
      - run: energy-agents-augmentation --edi --output outputs/augmentation_edi
      - run: energy-agents-firm --edi --output outputs/firm_supply_edi
      - run: energy-agents-heat --edi --output outputs/heat_reuse_edi
      - run: energy-agents-ops --output outputs/operations
      - run: energy-agents-cen --output outputs/cen_chile
      - uses: actions/upload-artifact@v4
        with:
          name: operations-review-demo
          path: |
            outputs/operations
            outputs/cen_chile
