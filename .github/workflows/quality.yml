name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,quantum]"
      - run: ruff check .
      - run: python -m pytest
      - run: python -m build
      - run: energy-agents --output outputs/building_edits
      - run: energy-agents-pv --output outputs/pv_operations
      - run: energy-agents-flex --output outputs/industrial_flexibility

      - run: energy-agents-commissioning --output outputs/wind_commissioning

      - run: energy-agents-bess --output outputs/bess_saturation

      - run: energy-agents-bridge --output outputs/bridge_power

      - run: energy-agents-reserve --output outputs/reserve

      - run: energy-agents-vppa --output outputs/vppa
      - run: energy-agents-procurement --output outputs/procurement
      - run: energy-agents-roles --output outputs/career_roles
      - run: energy-agents-qml --output outputs/quantum_ml
  quantum-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,quantum-hybrid]"
      - run: python -m pytest tests/test_quantum_ml_backends.py
      - run: energy-agents-qml --hybrid --output outputs/quantum_ml_hybrid
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-ml-research
          path: outputs/quantum_ml_hybrid
  operations-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,mcp]"
      # This EDI module is stdlib-only; other scientific EDI dependencies are unrelated.
      - run: python -m pip install --no-deps -r requirements/operations.txt
      - run: python -m pytest tests/test_operations_service.py tests/test_operations_mcp.py tests/test_cen_operations.py
      - run: energy-agents-ops --output outputs/operations
      - run: energy-agents-cen --output outputs/cen_chile
      - uses: actions/upload-artifact@v4
        with:
          name: operations-review-demo
          path: |
            outputs/operations
            outputs/cen_chile
