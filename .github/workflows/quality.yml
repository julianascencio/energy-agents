name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest
      - run: python -m build
      - run: energy-agents --output outputs/building_edits
      - run: energy-agents-pv --output outputs/pv_operations
      - run: energy-agents-flex --output outputs/industrial_flexibility

      - run: energy-agents-commissioning --output outputs/wind_commissioning

      - run: energy-agents-bess --output outputs/bess_saturation

      - run: energy-agents-bridge --output outputs/bridge_power

      - run: energy-agents-reserve --output outputs/reserve

      - run: energy-agents-vppa --output outputs/vppa
      - run: energy-agents-procurement --output outputs/procurement
